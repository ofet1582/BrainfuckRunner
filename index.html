<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Brainfuck</title>
        <link href="style.css" rel="stylesheet">
        <script src="chars.js"></script>
        <script defer src="gui.js"></script>
        <script src="run.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <main>
            <div class="block code">
                <div class="line">
                    Code
                    <button class="auto-left-margin" id="open">open</button>
                    <button id="save">save</button>
                    <button id="copy">copy</button>
                </div>
                <div class="text full code" id="code-box" contenteditable="true">
                    .++++++++++[>+>+++>+++++++>++++++++++&lt;&lt;&lt;&lt;-]>>>++.>+.+++++++..+++.&lt;&lt;++.>+++++++++++++++.>.+++.------.--------.
                    annot<br>ation
                </div>
            </div>
            <div class="line">
                <button class="auto-left-margin" id="debug-button" class="auto-left-margin" title="Show the tape of cells.">debug</button>
                <button id="run-button">run</button>
            </div>
            <div class="line-break"></div>
            <div class="block debug none-display">
            <!-- <div class="block debug"> -->
                <div class="zero-height">
                    <label class="zero-width" title="size of boxes">size:
                        <input id="size" type="number" value="50" min="1" max="300">
                    </label>
                </div>
                <div class="line">
                    <!-- <span class="placeholder"></span> -->
                    <input type="number" class="auto-both-margin" id="mid-cell" min="0" max="29999" title="the index of the cell in the middle of the screen" value="0">
                    <!-- <span class="placeholder"></span> -->
                </div>
                <div class="line-of-cells">
                    <span class="zero-width">
                        <button class="move" id="move-left">◀</button>
                    </span>
                    <span class="cells">
                        <span class="cell" id="314">
                            <div class="id" title="cell id">314</div>
                            <div class="box">
                                <div class="num" title="the number held by the cell">123</div>
                                <div class="char" title="the ASCII character represented by the number">\n</div>
                            </div>
                            <div class="pointer"><!-- ▲ --></div>
                        </span>
                    </span>
                    <span class="zero-width">
                        <button class="move" id="move-right">▶</button>
                    </span>
                </div>
                <div class="zero-height line">
                    <label title="Stick the tape so that the pointer moves on the screen.">stick
                        <input id="stick" type="checkbox">
                    </label>
                    <label class="auto-left-margin" title="running speed">speed:
                        <input id="speed" type="number" value="5" min="0" max="100000">
                    </label>
                </div>
                <div class="line">
                    <!-- <span class="placeholder"></span> -->
                    <button class="debugger auto-left-margin" id="debug-back">◁</button>
                    <button class="debugger" id="debug-pause"><!-- ⏸︎ -->▶</button>
                    <button class="debugger auto-right-margin" id="debug-next">▷</button>
                    <!-- <span class="placeholder"></span> -->
                </div>
            </div>
            <div class="block output">
                Output
                <button class="char-code output right-float" title="Show character codes">code</button>
                <div class="text full output" id="output-area">
                        
                </div>
            </div>
            <div class="block input">
                Input
                &emsp;
                <label title="The inputs won't be submitted unless you use the &crarr; button.">lock
                    <input id="lock-button" type="checkbox">
                </label>
                <button class="char-code input right-float" title="Show character codes">code</button>
                <div class="text full input">
                        
                </div>
                <button class="submit-one right-float" title="Submit one input.">&crarr;</button>
            </div>
        </main>
    </body>
</html>
