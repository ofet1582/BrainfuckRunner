<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Brainfuck</title>
        <link href="style.css" rel="stylesheet">
        <script src="gui.js"></script>
        <script src="run.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <main>
            <div class="block code">
                <div class="line">
                    Code
                    <button id="open">open</button>
                    <button id="save">save</button>
                    <button id="copy">copy</button>
                </div>
                <div class="text full code" contenteditable="true">
                    ++++++++++[>+>+++>+++++++>++++++++++&lt;&lt;&lt;&lt;-]>>>++.>+.+++++++..+++.&lt;&lt;++.>+++++++++++++++.>.+++.------.--------.
                </div>
            </div>
            <!-- <div class="line"> -->
                <button id="run" class="right">run</button>
                <button id="debug" class="right" title="Show the tape of cells.">debug</button>
            <!-- </div> -->
            <span class="line-break"></span>
            <!-- <div class="debug" style="display: none;"> -->
            <div class="block debug">
                <label>size:
                    <input id="size" type="number" title="size of boxes" value="50" min="1" max="300">
                </label>
                <div class="line-of-cells">
                    <button class="move" id="move-left">◀</button>
                    <span class="cells">
                        <span class="cell" id="314">
                            <div class="id" title="cell id">314</div>
                            <div class="box">
                                <div class="num" title="the number held by the cell">123</div>
                                <div class="char" title="the ASCII character represented by the number">\n</div>
                            </div>
                            <div class="pointer"><!-- ▲ --></div>
                        </span>
                    </span>
                    <button class="move" id="move-right">▶</button>
                </div>
                <!-- <div class="line"> -->
                    <div class="absolute-position">
                        <label for="stick" class="left">stick
                            <input id="stick" type="checkbox" title="Stick the tape so that the pointer moves on the screen.">
                        </label>
                        <label for="speed" class="right">speed:
                            <input id="speed" type="number" value="3" min="0" max="100000" title="running speed">
                        </label>
                    </div>
                    <div class="line">
                        <!-- <span class="placeholder"></span> -->
                        <button class="debugger mid-left" id="debug-back">◁</button>
                        <button class="debugger" id="debug-pause"><!-- ⏸︎ -->▶</button>
                        <button class="debugger mid-right" id="debug-next">▷</button>
                        <!-- <span class="placeholder"></span> -->
                    </div>
                <!-- </div> -->
            </div>
            <div class="block output">
                Output
                <button class="char-code output right" title="Show character codes">code</button>
                <div class="text full output">
                        
                </div>
            </div>
            <div class="block input">
                Input
                <button class="char-code input right" title="Show character codes">code</button>
                <div class="text full input">
                        
                </div>
                <button class="submit-one right" title="Submit one input.">&crarr;</button>
            </div>
        </main>
    </body>
</html>
