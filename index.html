<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Brainfuck</title>
        <link href="style.css" rel="stylesheet">
        <script src="gui.js"></script>
        <script src="run.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <main>
            <div class="block code">
                <div class="line">
                    Code
                    <button id="open">open</button>
                    <button id="save">save</button>
                    <button id="copy">copy</button>
                </div>
                <div class="text full code" contenteditable="true">
                    ++++++++++[>+>+++>+++++++>++++++++++&lt;&lt;&lt;&lt;-]>>>++.>+.+++++++..+++.&lt;&lt;++.>+++++++++++++++.>.+++.------.--------.
                </div>
            </div>
            <div class="line">
                <span class="placeholder"></span>
                <button id="debug">debug</button>
                <button id="run">run</button>
            </div>
            <!-- <div class="debug" style="display: none;"> -->
            <div class="block debug">
                size:
                <button class="size sub">-</button>
                <span class="text" contenteditable="true">50</span>
                <button class="size add">+</button>
                <div class="line">
                    speed:
                    <button class="size sub">-</button>
                    <span class="text" contenteditable="true">3</span>
                    <button class="size add">+</button>
                </div>
                <div class="line-of-cells">
                    <button class="move left">◀</button>
                    <span class="cells">
                        <span class="cell" id="314">
                            <div class="id">314</div>
                            <div class="box">
                                <div class="num">123</div>
                                <div class="char">\n</div>
                            </div>
                        </span>
                    </span>
                    <button class="move right">▶</button>
                </div>
            </div>
            <div class="block output">
                <div class="line">
                    Output
                    <span class="placeholder"></span>
                    <button class="char-code output">code</button>
                </div>
                <div class="text full output">
                        
                </div>
            </div>
            <div class="block input">
                <div class="line">
                    Input
                    <span class="placeholder"></span>
                    <button class="char-code output">code</button>
                </div>
                <div class="text full input">
                        
                </div>
            </div>
        </main>
    </body>
</html>
